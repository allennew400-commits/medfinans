<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Задачи — МЕДФИНАНС ГРУПП</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="container">
  <h1 class="page-title">Задачи</h1>
  
  <div class="tabs" style="display:flex; gap:8px; margin-bottom:24px; background:var(--surface); padding:6px; border-radius:var(--radius-sm); width:fit-content; box-shadow:var(--shadow-sm);">
    <button class="tab active" data-s="common" style="padding:8px 16px; border:none; background:var(--primary); color:white; border-radius:6px; cursor:pointer; font-weight:600;">Общие</button>
    <button class="tab" data-s="personal" style="padding:8px 16px; border:none; background:transparent; color:var(--text-muted); border-radius:6px; cursor:pointer; font-weight:600;">Мои задачи</button>
    <button class="tab" data-s="archive" style="padding:8px 16px; border:none; background:transparent; color:var(--text-muted); border-radius:6px; cursor:pointer; font-weight:600;">Архив</button>
  </div>

  <div class="card">
    <button class="btn" id="addBtn" style="margin-bottom:20px;">+ Добавить задачу</button>
    <div id="list"></div>
  </div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="modalTitle">Новая задача</h2>
    <div class="field"><label>Текст задачи</label><textarea class="input" id="mText" rows="3"></textarea></div>
    <div class="field"><label>Дата выполнения</label><input class="input" type="date" id="mDate"></div>
    <div class="field"><label>Повтор</label>
      <select class="input" id="mRec">
        <option value="none">Нет</option>
        <option value="daily">Ежедневно</option>
        <option value="weekly">Еженедельно</option>
        <option value="monthly">Ежемесячно</option>
      </select>
    </div>
    <div class="field" id="assigneeField"><label>Для кого</label><select class="input" id="mAssignee"></select></div>
    <div class="modal-actions">
      <button class="btn secondary" id="mCancel">Отмена</button>
      <button class="btn" id="mSave">Создать</button>
    </div>
  </div>
</div>
<script type="module" src="assets/js/tasks.js"></script>
</body>
</html>
