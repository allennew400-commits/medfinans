<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пароли | МЕДФИНАНС ГРУПП</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <a href="app.html" class="sidebar-logo"><img src="assets/logo.png" alt="M" style="width: 40px; border-radius: 8px;" onerror="this.outerHTML='<i class=\'fa-solid fa-chart-pie\'></i>'"></a>
      <nav class="nav-menu">
        <a href="app.html" class="nav-item" title="Главная"><i class="fa-solid fa-house"></i></a>
        <a href="clients.html" class="nav-item" title="Клиенты"><i class="fa-solid fa-users"></i></a>
        <a href="tasks.html" class="nav-item" title="Задачи"><i class="fa-solid fa-list-check"></i></a>
        <a href="passwords.html" class="nav-item active" title="Пароли"><i class="fa-solid fa-key"></i></a>
        <a href="salary.html" class="nav-item" title="Зарплаты"><i class="fa-solid fa-money-bill-wave"></i></a>
        <a href="reports.html" class="nav-item" title="Отчетность"><i class="fa-solid fa-file-invoice"></i></a>
        <a href="payments.html" class="nav-item" title="Платежи"><i class="fa-solid fa-credit-card"></i></a>
        <a href="custom.html" class="nav-item" title="Произвольные"><i class="fa-solid fa-layer-group"></i></a>
        <a href="calendar.html" class="nav-item" title="Календарь"><i class="fa-solid fa-calendar-days"></i></a>
      </nav>
      <button id="logout-btn" class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="mobile-menu-btn" id="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
          <h1>База паролей</h1>
        </div>
        <div class="user-info"><div class="avatar" id="user-avatar">M</div></div>
      </header>

      <div class="page-container">
        <!-- Вкладки -->
        <div class="tabs-container" id="pass-tabs" style="overflow-x: auto; max-width: 100%;">
          <button class="tab-btn active" data-cat="1c">1С</button>
          <button class="tab-btn" data-cat="banks">Банки</button>
          <button class="tab-btn" data-cat="cash">Касса</button>
          <button class="tab-btn" data-cat="ecp">ЭЦП пароли</button>
          <button class="tab-btn" data-cat="pharma">Фарма</button>
          <button class="tab-btn" data-cat="gpc">ДЖИ ПИ СИ</button>
          <button class="tab-btn" data-cat="sogaz">Согаз</button>
        </div>

        <!-- Кнопка редактирования -->
        <div class="d-flex justify-between align-center mb-4 mt-4">
          <h3 class="text-muted" id="current-category-title">Пароли 1С</h3>
          <div>
            <button id="btn-edit-pass" class="btn btn-primary"><i class="fa-solid fa-pen"></i> Редактировать</button>
            <button id="btn-save-pass" class="btn btn-success" style="display: none;"><i class="fa-solid fa-floppy-disk"></i> Сохранить</button>
            <button id="btn-cancel-pass" class="btn btn-outline" style="display: none;">Отмена</button>
          </div>
        </div>

        <!-- Таблица -->
        <div class="table-container">
          <div class="table-responsive">
            <table id="pass-table">
              <thead id="pass-thead"></thead>
              <tbody id="pass-tbody">
                <!-- Данные рендерятся JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/passwords.js"></script>
</body>
</html>
