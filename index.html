<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - МЕДФИНАНС ГРУПП</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="manifest" href="assets/manifest.json">
</head>
<body style="justify-content: center; align-items: center; background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);">
    <div class="card" style="width: 100%; max-width: 400px; padding: 40px; text-align: center;">
        <!-- Логотип -->
        <img src="assets/logo.png" alt="Логотип" style="max-width: 100px; margin-bottom: 20px; border-radius: 12px;">
        <h2 style="margin-bottom: 10px; color: var(--primary);">МЕДФИНАНС ГРУПП</h2>
        <p style="color: var(--text-muted); margin-bottom: 30px; font-size: 14px;">Вход в систему</p>
        
        <form id="loginForm" style="text-align: left;">
            <div class="form-group">
                <label>Логин (Email)</label>
                <input type="email" id="email" required placeholder="Введите ваш email">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" required placeholder="Введите пароль">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Войти</button>
            <p id="error-msg" style="color: var(--danger); font-size: 13px; margin-top: 10px; display: none;"></p>
        </form>
    </div>

    <script type="module">
        import { login } from './assets/js/auth.js';

        // Если уже вошли, редирект на app.html
        import { supabase } from './assets/js/supabase.js';
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = 'app.html';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const err = document.getElementById('error-msg');
            btn.disabled = true;
            btn.textContent = 'Загрузка...';
            err.style.display = 'none';

            try {
                await login(document.getElementById('email').value, document.getElementById('password').value);
                window.location.href = 'app.html';
            } catch (error) {
                err.textContent = 'Неверный логин или пароль';
                err.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Войти';
            }
        });
    </script>
</body>
</html>
