<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная | МЕДФИНАНС ГРУПП</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="manifest" href="assets/manifest.json">
</head>
<body>
  <div class="app-layout">
    <!-- САЙДБАР -->
    <aside class="sidebar" id="sidebar">
      <a href="app.html" class="sidebar-logo">
        <img src="assets/logo.png" alt="M" style="width: 40px; border-radius: 8px;" onerror="this.outerHTML='<i class=\'fa-solid fa-chart-pie\'></i>'">
      </a>
      <nav class="nav-menu">
        <a href="app.html" class="nav-item active" title="Главная"><i class="fa-solid fa-house"></i></a>
        <a href="clients.html" class="nav-item" title="Клиенты"><i class="fa-solid fa-users"></i></a>
        <a href="tasks.html" class="nav-item" title="Задачи"><i class="fa-solid fa-list-check"></i></a>
        <a href="passwords.html" class="nav-item" title="Пароли"><i class="fa-solid fa-key"></i></a>
        <a href="salary.html" class="nav-item" title="Зарплаты"><i class="fa-solid fa-money-bill-wave"></i></a>
        <a href="reports.html" class="nav-item" title="Отчетность"><i class="fa-solid fa-file-invoice"></i></a>
        <a href="payments.html" class="nav-item" title="Платежи"><i class="fa-solid fa-credit-card"></i></a>
        <a href="custom.html" class="nav-item" title="Произвольные"><i class="fa-solid fa-layer-group"></i></a>
        <a href="calendar.html" class="nav-item" title="Календарь"><i class="fa-solid fa-calendar-days"></i></a>
      </nav>
      <button id="logout-btn" class="logout-btn" title="Выйти"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </aside>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="main-content">
      <header class="top-header">
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="mobile-menu-btn" id="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
          <h1>Доброе утро, <span id="user-name-display">Сотрудник</span>!</h1>
        </div>
        <div class="user-info">
          <div class="avatar" id="user-avatar">M</div>
        </div>
      </header>

      <div class="page-container">
        <div class="dashboard-grid" id="dashboard-container">
          <!-- Сюда JS будет рендерить карточки -->
          <div class="card col-12 skeleton" style="height: 200px;"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
