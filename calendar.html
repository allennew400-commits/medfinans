<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь | МЕДФИНАНС ГРУПП</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <a href="app.html" class="sidebar-logo"><img src="assets/logo.png" alt="M" style="width: 40px; border-radius: 8px;" onerror="this.outerHTML='<i class=\'fa-solid fa-chart-pie\'></i>'"></a>
      <nav class="nav-menu">
        <a href="app.html" class="nav-item" title="Главная"><i class="fa-solid fa-house"></i></a>
        <a href="clients.html" class="nav-item" title="Клиенты"><i class="fa-solid fa-users"></i></a>
        <a href="tasks.html" class="nav-item" title="Задачи"><i class="fa-solid fa-list-check"></i></a>
        <a href="passwords.html" class="nav-item" title="Пароли"><i class="fa-solid fa-key"></i></a>
        <a href="salary.html" class="nav-item" title="Зарплаты"><i class="fa-solid fa-money-bill-wave"></i></a>
        <a href="reports.html" class="nav-item" title="Отчетность"><i class="fa-solid fa-file-invoice"></i></a>
        <a href="payments.html" class="nav-item" title="Платежи"><i class="fa-solid fa-credit-card"></i></a>
        <a href="custom.html" class="nav-item" title="Произвольные"><i class="fa-solid fa-layer-group"></i></a>
        <a href="calendar.html" class="nav-item active" title="Календарь"><i class="fa-solid fa-calendar-days"></i></a>
      </nav>
      <button id="logout-btn" class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="mobile-menu-btn" id="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
          <h1>Календарь событий</h1>
        </div>
        <div class="user-info"><div class="avatar" id="user-avatar">M</div></div>
      </header>

      <div class="page-container">
        <div class="calendar-wrapper">
          <div class="calendar-header">
            <button class="btn btn-icon" id="prev-month"><i class="fa-solid fa-chevron-left"></i></button>
            <h2 id="current-month-year" style="font-size: 1.5rem; margin: 0;">Месяц Год</h2>
            <button class="btn btn-icon" id="next-month"><i class="fa-solid fa-chevron-right"></i></button>
          </div>

          <div class="calendar-grid" id="calendar-grid">
            <!-- Дни недели -->
            <div class="calendar-day-name">Пн</div>
            <div class="calendar-day-name">Вт</div>
            <div class="calendar-day-name">Ср</div>
            <div class="calendar-day-name">Чт</div>
            <div class="calendar-day-name">Пт</div>
            <div class="calendar-day-name">Сб</div>
            <div class="calendar-day-name">Вс</div>
            <!-- Дни генерируются JS -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/calendar.js"></script>
</body>
</html>
