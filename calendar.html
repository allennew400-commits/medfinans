<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Календарь — МЕДФИНАНС ГРУПП</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
    <h1 class="page-title" style="margin:0" id="monthTitle"></h1>
    <div>
      <button class="btn secondary small" id="prev">←</button>
      <button class="btn secondary small" id="today">Сегодня</button>
      <button class="btn secondary small" id="next">→</button>
    </div>
  </div>
  <div class="card">
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;text-align:center;font-weight:600;font-size:12px;color:var(--muted)">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div class="calendar-grid" id="grid"></div>
  </div>
</div>
<script type="module" src="assets/js/calendar.js"></script>
</body>
</html>
