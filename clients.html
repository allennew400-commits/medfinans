<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клиенты - МЕДФИНАНС ГРУПП</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="mobile-header">
        <button class="burger-menu" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
        <div class="logo-container"><img src="assets/logo.png" alt=""> МедФинанс</div>
    </div>
    <aside class="sidebar">
        <div class="logo-container"><img src="assets/logo.png" alt="Логотип"><span>МЕДФИНАНС</span></div>
        <ul class="nav-links">
            <li><a href="app.html">Главная</a></li>
            <li><a href="clients.html" class="active">Клиенты</a></li>
            <li><a href="tasks.html">Задачи</a></li>
            <li><a href="passwords.html">Пароли</a></li>
            <li><a href="salary.html">Зарплаты</a></li>
            <li><a href="reports.html">Отчетность</a></li>
            <li><a href="payments.html">Платежи</a></li>
            <li><a href="custom.html">Произвольное</a></li>
            <li><a href="calendar.html">Календарь</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h1>Клиенты</h1>
            <div class="user-info" id="user-header"></div>
        </header>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <div class="tabs" style="margin: 0; border: none;">
                <button class="tab active" data-kind="all">Все</button>
                <button class="tab" data-kind="ООО">ООО</button>
                <button class="tab" data-kind="ИП">ИП</button>
            </div>
            <div style="display: flex; gap: 10px; width: 100%; max-width: 400px;">
                <input type="text" id="searchInput" placeholder="Поиск по названию, ИНН, адресу..." style="width: 100%;">
                <button class="btn btn-primary" onclick="window.location.href='client.html'">+ Добавить</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Название</th>
                        <th>Тип</th>
                        <th>ИНН</th>
                        <th>Директор</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="clientsTableBody">
                    <tr><td colspan="6" style="text-align: center;">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { checkAuth } from './assets/js/auth.js';
        import { initClients } from './assets/js/clients.js';
    
        const user = await checkAuth();
        if (user) initClients();
    </script>
</body>
</html>
