<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчетность - МЕДФИНАНС ГРУПП</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="manifest" href="assets/manifest.json">
</head>
<body>
    <div class="mobile-header">
        <button class="burger-menu" onclick="document.querySelector('.sidebar').classList.toggle('open')">Меню</button>
        <div class="logo-container"><img src="assets/logo.png" alt=""> МедФинанс</div>
    </div>
    <aside class="sidebar">
        <div class="logo-container"><img src="assets/logo.png" alt="Логотип"><span>МЕДФИНАНС</span></div>
        <ul class="nav-links">
            <li><a href="app.html">Главная</a></li>
            <li><a href="clients.html">Клиенты</a></li>
            <li><a href="tasks.html">Задачи</a></li>
            <li><a href="passwords.html">Пароли</a></li>
            <li><a href="salary.html">Зарплаты</a></li>
            <li><a href="reports.html" class="active">Отчетность</a></li>
            <li><a href="payments.html">Платежи</a></li>
            <li><a href="custom.html">Произвольное</a></li>
            <li><a href="calendar.html">Календарь</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h1>Отчетность</h1>
            <div class="user-info" id="user-header"></div>
        </header>

        <div style="margin-bottom: 20px;">
            <button class="btn btn-primary" id="addReportBtn">Добавить</button>
        </div>

        <div id="reportsList" class="dashboard-grid">
            <div style="color: var(--text-muted);">Загрузка...</div>
        </div>
    </main>

    <div class="modal-overlay" id="reportModal">
        <div class="modal-content">
            <button class="modal-close" onclick="document.getElementById('reportModal').classList.remove('active')">&times;</button>
            <h3>Новый отчет</h3>
            <div class="form-group">
                <label>Название отчетности</label>
                <input type="text" id="reportTitle" required>
            </div>
            <div class="form-group">
                <label>Дата сдачи</label>
                <input type="date" id="reportDate" required>
            </div>
            <button class="btn btn-primary" id="createReportBtn">Создать</button>
        </div>
    </div>

    <script type="module">
        import { checkAuth } from './assets/js/auth.js';
        import { supabase } from './assets/js/supabase.js';
        import { formatDate } from './assets/js/utils.js';

        let currentUser = null;

        async function init() {
            currentUser = await checkAuth();
            if (!currentUser) return;
            loadReports();
        }

        async function loadReports() {
            const { data: reports } = await supabase.from('reports').select('*').order('due_date', { ascending: false });
            const container = document.getElementById('reportsList');
            if (!reports || reports.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted);">Нет созданных отчетов</div>';
                return;
            }
            container.innerHTML = reports.map(r => `
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div style="font-size: 16px; font-weight: 600;">${r.title}</div>
                            <div style="font-size: 14px; color: var(--text-muted);">${formatDate(r.due_date)}</div>
                        </div>
                        <span class="badge ${r.done ? 'badge-success' : 'badge-pending'}">${r.done ? 'Сдано' : 'Не сдано'}</span>
                    </div>
                    <div style="margin-top: 15px; text-align: right;">
                        ${!r.done ? `<button class="btn btn-success btn-sm done-btn" data-id="${r.id}">Выполнено</button>` : ''}
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.done-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    if (!confirm('Подтвердить сдачу отчета по всем организациям?')) return;
                    await supabase.from('reports').update({ done: true }).eq('id', e.target.dataset.id);
                    loadReports();
                });
            });
        }

        document.getElementById('addReportBtn').addEventListener('click', () => {
            document.getElementById('reportModal').classList.add('active');
        });

        document.getElementById('createReportBtn').addEventListener('click', async () => {
            const title = document.getElementById('reportTitle').value;
            const date = document.getElementById('reportDate').value;
            if (!title || !date) return alert('Заполните название и дату');
            await supabase.from('reports').insert([{ title, due_date: date, created_by: currentUser.id }]);
            document.getElementById('reportModal').classList.remove('active');
            loadReports();
        });

        init();
    </script>
</body>
</html>
