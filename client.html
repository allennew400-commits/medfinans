<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка клиента</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="mobile-header">
        <button class="burger-menu" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
        <div class="logo-container"><img src="assets/logo.png" alt=""> МедФинанс</div>
    </div>
    <aside class="sidebar">
        <div class="logo-container"><img src="assets/logo.png" alt="Логотип"><span>МЕДФИНАНС</span></div>
        <ul class="nav-links">
            <li><a href="app.html">Главная</a></li>
            <li><a href="clients.html" class="active">Клиенты</a></li>
            <li><a href="tasks.html">Задачи</a></li>
            <li><a href="passwords.html">Пароли</a></li>
            <li><a href="salary.html">Зарплаты</a></li>
            <li><a href="reports.html">Отчетность</a></li>
            <li><a href="payments.html">Платежи</a></li>
            <li><a href="custom.html">Произвольное</a></li>
            <li><a href="calendar.html">Календарь</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h1 id="clientTitle">Карточка клиента</h1>
            <div class="user-info" id="user-header"></div>
        </header>

        <div style="margin-bottom: 20px; display: flex; gap: 10px;">
            <button class="btn btn-outline" onclick="window.location.href='clients.html'">Назад</button>
            <button class="btn btn-primary" id="editBtn">Редактировать</button>
            <button class="btn btn-success" id="saveBtn" style="display:none;">Сохранить</button>
            <button class="btn btn-primary" id="createBtn" style="display:none;">Создать</button>
        </div>

        <div class="card" id="clientCard">
            <div style="text-align: center; color: var(--text-muted);">Загрузка данных...</div>
        </div>

        <!-- Заметки -->
        <div class="card" style="margin-top: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>Заметки</h3>
                <button class="btn btn-primary btn-sm" id="addNoteBtn">+ Добавить заметку</button>
            </div>
            <div id="notesList">Загрузка...</div>
        </div>
    </main>

    <!-- Модалка заметки -->
    <div class="modal-overlay" id="noteModal">
        <div class="modal-content">
            <button class="modal-close" onclick="document.getElementById('noteModal').classList.remove('active')">&times;</button>
            <h3>Новая заметка</h3>
            <div class="form-group">
                <label>Текст (обязательно)</label>
                <textarea id="noteText" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Дата (необязательно)</label>
                <input type="date" id="noteDate">
            </div>
            <button class="btn btn-primary" id="saveNoteBtn">Создать</button>
        </div>
    </div>

    <script type="module">
        import { checkAuth } from './assets/js/auth.js';
        import { initClient } from './assets/js/client.js';
    
        const user = await checkAuth();
        if (user) initClient(user);
    </script>
</body>
</html>
