<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Произвольные списки | МЕДФИНАНС ГРУПП</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <a href="app.html" class="sidebar-logo"><img src="assets/logo.png" alt="M" style="width: 40px; border-radius: 8px;" onerror="this.outerHTML='<i class=\'fa-solid fa-chart-pie\'></i>'"></a>
      <nav class="nav-menu">
        <a href="app.html" class="nav-item" title="Главная"><i class="fa-solid fa-house"></i></a>
        <a href="clients.html" class="nav-item" title="Клиенты"><i class="fa-solid fa-users"></i></a>
        <a href="tasks.html" class="nav-item" title="Задачи"><i class="fa-solid fa-list-check"></i></a>
        <a href="passwords.html" class="nav-item" title="Пароли"><i class="fa-solid fa-key"></i></a>
        <a href="salary.html" class="nav-item" title="Зарплаты"><i class="fa-solid fa-money-bill-wave"></i></a>
        <a href="reports.html" class="nav-item" title="Отчетность"><i class="fa-solid fa-file-invoice"></i></a>
        <a href="payments.html" class="nav-item" title="Платежи"><i class="fa-solid fa-credit-card"></i></a>
        <a href="custom.html" class="nav-item active" title="Произвольные"><i class="fa-solid fa-layer-group"></i></a>
        <a href="calendar.html" class="nav-item" title="Календарь"><i class="fa-solid fa-calendar-days"></i></a>
      </nav>
      <button id="logout-btn" class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="mobile-menu-btn" id="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
          <h1>Произвольные списки</h1>
        </div>
        <div class="user-info"><div class="avatar" id="user-avatar">M</div></div>
      </header>

      <div class="page-container">
        <div class="d-flex justify-between align-center mb-4">
            <p class="text-muted">Создавайте собственные списки задач по клиентам</p>
            <button class="btn btn-primary" id="btn-add-custom"><i class="fa-solid fa-plus"></i> Создать список</button>
        </div>

        <div class="dashboard-grid" id="custom-lists-container">
          <!-- Списки рендерятся тут -->
        </div>
      </div>
    </main>
  </div>

  <!-- Модалка создания списка -->
  <div class="modal-overlay" id="create-custom-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h2 class="modal-title">Новый список</h2>
        <button class="modal-close" onclick="document.getElementById('create-custom-modal').classList.remove('active')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Название списка *</label>
          <input type="text" id="custom-title" class="form-control" placeholder="Например: Подготовка к 8 марта">
        </div>
        <div class="form-group">
          <label class="form-label">Дата (необязательно)</label>
          <input type="date" id="custom-date" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Выберите организации</label>
          <label class="checkbox-group mb-2">
            <input type="checkbox" id="select-all-clients"> <strong>Выбрать все</strong>
          </label>
          <div class="checkbox-list" id="clients-checkbox-list">
            <!-- Чекбоксы клиентов -->
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="document.getElementById('create-custom-modal').classList.remove('active')">Отмена</button>
        <button class="btn btn-primary" id="btn-save-custom">Создать</button>
      </div>
    </div>
  </div>

  <!-- Модалка просмотра/редактирования списка -->
  <div class="modal-overlay" id="view-custom-modal">
    <div class="modal-container" style="max-width: 800px;">
      <div class="modal-header">
        <h2 class="modal-title" id="view-custom-title">Список</h2>
        <div>
            <button class="btn btn-sm btn-outline" id="btn-edit-custom-items" style="margin-right: 8px;">Редактировать</button>
            <button class="modal-close" onclick="document.getElementById('view-custom-modal').classList.remove('active')">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr><th>Организация</th><th>Заметка</th><th>Дата</th></tr>
                </thead>
                <tbody id="custom-items-tbody">
                    <!-- Элементы списка -->
                </tbody>
            </table>
        </div>
      </div>
      <div class="modal-footer" id="view-custom-footer" style="display: none;">
        <button class="btn btn-outline" id="btn-cancel-edit-items">Отмена</button>
        <button class="btn btn-success" id="btn-save-edit-items">Сохранить изменения</button>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/custom.js"></script>
</body>
</html>
