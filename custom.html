<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Произвольное - МЕДФИНАНС ГРУПП</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="manifest" href="assets/manifest.json">
</head>
<body>
    <div class="mobile-header">
        <button class="burger-menu" onclick="document.querySelector('.sidebar').classList.toggle('open')">Меню</button>
        <div class="logo-container"><img src="assets/logo.png" alt=""> МедФинанс</div>
    </div>
    <aside class="sidebar">
        <div class="logo-container"><img src="assets/logo.png" alt="Логотип"><span>МЕДФИНАНС</span></div>
        <ul class="nav-links">
            <li><a href="app.html">Главная</a></li>
            <li><a href="clients.html">Клиенты</a></li>
            <li><a href="tasks.html">Задачи</a></li>
            <li><a href="passwords.html">Пароли</a></li>
            <li><a href="salary.html">Зарплаты</a></li>
            <li><a href="reports.html">Отчетность</a></li>
            <li><a href="payments.html">Платежи</a></li>
            <li><a href="custom.html" class="active">Произвольное</a></li>
            <li><a href="calendar.html">Календарь</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h1>Произвольные списки</h1>
            <div class="user-info" id="user-header"></div>
        </header>

        <div style="margin-bottom: 20px;">
            <button class="btn btn-primary" id="addListBtn">Добавить</button>
        </div>

        <div id="customListsContainer" class="dashboard-grid">
            <div style="color: var(--text-muted);">Загрузка...</div>
        </div>
    </main>

    <div class="modal-overlay" id="listModal">
        <div class="modal-content">
            <button class="modal-close" onclick="document.getElementById('listModal').classList.remove('active')">&times;</button>
            <h3>Новый список</h3>
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="listTitle" required>
            </div>
            <div class="form-group">
                <label>Дата (необязательно)</label>
                <input type="date" id="listDate">
            </div>
            <div class="form-group">
                <label>Организации</label>
                <div style="margin-bottom: 5px;">
                    <button class="btn btn-outline btn-sm" id="selectAllBtn" type="button">Выбрать все</button>
                </div>
                <div id="clientCheckboxes" style="max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px;"></div>
            </div>
            <button class="btn btn-primary" id="createListBtn">Создать</button>
        </div>
    </div>

    <script type="module">
        import { checkAuth } from './assets/js/auth.js';
        import { initCustom } from './assets/js/custom.js';
    
        const user = await checkAuth();
        if (user) initCustom(user);
    </script>
</body>
</html>
